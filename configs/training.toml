[training]
num_train_epochs = 2
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.0002
lr_scheduler_type = "cosine"
warmup_steps = 5
optim = "adamw_torch"
max_length = 1024
gradient_checkpointing = true
save_strategy = "steps"
save_steps = 5
save_total_limit = 3
eval_strategy = "steps"
eval_steps = 10
logging_steps = 1
seed = 42
data_seed = 42

[adapter]
rank = 8
alpha = 16
lora_dropout = 0.05
target_modules = "all-linear"
