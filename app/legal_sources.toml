- Mức 3 (vượt quá 80 mg/100 ml máu hoặc vượt quá 0,4 mg/1 lít khí thở): phạt tiền từ 30.000.000 đến 40.000.000 đồng và tước quyền sử dụng giấy phép lái xe từ 22 tháng đến 24 tháng (điểm a khoản 11 và điểm c khoản 15 Điều 6)."""

