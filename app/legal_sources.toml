- Mức 1 (chưa vượt quá 50 mg/100 ml máu hoặc chưa vượt quá 0,25 mg/1 lít khí thở): phạt tiền từ 6.000.000 đến 8.000.000 đồng và trừ 04 điểm giấy phép lái xe (điểm c khoản 6 và điểm b khoản 16 Điều 6).
