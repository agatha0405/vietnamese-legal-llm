citation = "điểm a khoản 6, điểm b khoản 8, điểm d khoản 9, điểm c khoản 12, điểm b và điểm d khoản 13 Điều 7"
fact = """Người điều khiển xe mô tô hoặc xe gắn máy trên đường mà trong máu hoặc hơi thở có nồng độ cồn bị xử phạt theo 03 mức:
- Mức 1 (chưa vượt quá 50 mg/100 ml máu hoặc chưa vượt quá 0,25 mg/1 lít khí thở): phạt tiền từ 2.000.000 đến 3.000.000 đồng và trừ 04 điểm giấy phép lái xe (điểm a khoản 6 và điểm b khoản 13 Điều 7).
- Mức 2 (vượt quá 50 mg đến 80 mg/100 ml máu hoặc vượt quá 0,25 mg đến 0,4 mg/1 lít khí thở): phạt tiền từ 6.000.000 đến 8.000.000 đồng và trừ 10 điểm giấy phép lái xe (điểm b khoản 8 và điểm d khoản 13 Điều 7).
- Mức 3 (vượt quá 80 mg/100 ml máu hoặc vượt quá 0,4 mg/1 lít khí thở): phạt tiền từ 8.000.000 đến 10.000.000 đồng và tước quyền sử dụng giấy phép lái xe từ 22 tháng đến 24 tháng (điểm d khoản 9 và điểm c khoản 12 Điều 7)."""

