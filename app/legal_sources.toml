[topics.signal]
matches = ['\b(vượt|qua) đèn đỏ\b', '\bkhông (chấp hành|tuân thủ) (hiệu lệnh (của )?)?đèn (tín hiệu|giao thông|đỏ)\b']
exclude = ['\b(đèn đỏ nhấp nháy|đường sắt|đường ngang|xe ưu tiên|cảnh sát|csgt|rẽ|đèn mũi tên|biển phụ|xe cứu thương)\b', '\b(không|chưa) (vượt|qua) đèn đỏ\b']
condition = "không chấp hành hiệu lệnh của đèn tín hiệu giao thông (không gây tai nạn giao thông)"

[topics.helmet]
matches = ['\b(không đội|không cài quai|quên đội) mũ bảo hiểm\b', '\bđội mũ bảo hiểm không cài quai\b']
exclude = ['\b(người ngồi sau|ngồi sau|người được chở|chở người|trẻ em)\b']
condition = "không đội “mũ bảo hiểm cho người đi mô tô, xe máy” hoặc đội “mũ bảo hiểm cho người đi mô tô, xe máy” không cài quai đúng quy cách khi điều khiển xe tham gia giao thông trên đường bộ"

[topics.helmet_passenger]
matches = ['\bchở người(?: ngồi trên xe)? (?:không đội|không cài quai) mũ bảo hiểm\b', '\bngười (?:ngồi sau|được chở)[^\n]{0,25}(?:không đội|không cài quai) mũ bảo hiểm\b']
exclude = ['\b(người bệnh|cấp cứu|dưới 6 tuổi|dưới 06 tuổi|áp giải)\b']
condition = "chở người ngồi trên xe không đội “mũ bảo hiểm cho người đi mô tô, xe máy” hoặc đội “mũ bảo hiểm cho người đi mô tô, xe máy” không cài quai đúng quy cách (trừ trường hợp chở người bệnh đi cấp cứu, trẻ em dưới 06 tuổi, áp giải người có hành vi vi phạm pháp luật)"

[topics.phone]
matches = ['\b(điện thoại|thiết bị điện tử)\b']
exclude = ['\b(rảnh tay|không cầm|không dùng tay|không sử dụng|đã đỗ|đã dừng|đang đỗ|hành khách|người ngồi sau)\b']
facts = ['\b(đang chạy|đang di chuyển|đang lưu thông|đang điều khiển)\b', '\b(cầm|cầm tay|dùng tay)\b']
clarification = "Xe có đang chạy và người lái có dùng tay cầm thiết bị không?"
condition = "dùng tay cầm và sử dụng điện thoại hoặc các thiết bị điện tử khác khi điều khiển phương tiện đang di chuyển trên đường bộ"

[topics.wrong_way]
matches = ['\bđi ngược chiều\b', '\bngược chiều (?:của )?đường một chiều\b', '\bngược chiều[^\n]{0,25}đường một chiều\b', '\bngược chiều[^\n]{0,25}cấm đi ngược chiều\b']
exclude = ['\b(cao tốc|xe ưu tiên|làm nhiệm vụ khẩn cấp|lùi xe|quay đầu)\b']
condition = "đi ngược chiều của đường một chiều, đi ngược chiều trên đường có biển “Cấm đi ngược chiều” (không gây tai nạn giao thông)"

[topics.wrong_way_expressway]
matches = ['\bđi ngược chiều[^\n]{0,30}cao tốc\b', '\bcao tốc[^\n]{0,30}đi ngược chiều\b']
exclude = ['\b(xe ưu tiên|làm nhiệm vụ khẩn cấp|lùi xe|quay đầu)\b']
condition = "điều khiển xe đi ngược chiều trên đường cao tốc (trừ các xe ưu tiên đang đi làm nhiệm vụ khẩn cấp theo quy định)"

[topics.turn_signal]
matches = ['\b(?:không bật|không có|không dùng|thiếu|quên) (?:tín hiệu )?(?:xi[- ]?nhan|đèn báo rẽ|tín hiệu báo hướng rẽ)\b', '\bchuyển hướng[^\n]{0,25}(?:không bật xi[- ]?nhan|không có tín hiệu|không báo hướng rẽ)\b', '\b(?:rẽ trái|rẽ phải|chuyển hướng)[^\n]{0,15}không (?:bật )?xi[- ]?nhan\b']
exclude = ['\b(vượt đèn đỏ|chuyển làn|đoạn đường cong|nơi đường không giao nhau cùng mức)\b']
condition = "chuyển hướng không quan sát hoặc không bảo đảm khoảng cách an toàn với xe phía sau hoặc không giảm tốc độ hoặc không có tín hiệu báo hướng rẽ hoặc có tín hiệu báo hướng rẽ nhưng không sử dụng liên tục trong quá trình chuyển hướng (trừ trường hợp đi theo hướng cong của đoạn đường bộ ở nơi đường không giao nhau cùng mức)"

[topics.lane_change]
matches = ['\bchuyển làn(?: đường)? (?:không đúng nơi|không đúng quy định|không có tín hiệu|không bật xi[- ]?nhan|sai quy định|không bảo đảm khoảng cách)\b']
exclude = ['\bcao tốc\b']
condition = "chuyển làn đường không đúng nơi cho phép hoặc không có tín hiệu báo trước hoặc chuyển làn đường không đúng quy định “mỗi lần chuyển làn đường chỉ được phép chuyển sang một làn đường liền kề” (không gây tai nạn)"

[topics.lane_change_expressway]
matches = ['\bchuyển làn(?: đường)?[^\n]{0,40}cao tốc\b', '\bcao tốc[^\n]{0,40}chuyển làn(?: đường)? (?:không đúng|không có tín hiệu|không bật|sai quy định|không bảo đảm)\b']
exclude = []
condition = "chuyển làn đường không đúng nơi cho phép hoặc không có tín hiệu báo trước hoặc chuyển làn đường không đúng quy định “mỗi lần chuyển làn đường chỉ được phép chuyển sang một làn đường liền kề” khi chạy trên đường cao tốc"

[topics.seatbelt]
matches = ['\b(không thắt|không đeo|không cài|quên thắt) dây(?: đai)? an toàn\b']
exclude = ['\b(người được chở|hành khách|ngồi sau)\b']
condition = "không thắt dây đai an toàn khi điều khiển xe chạy trên đường"

[topics.sidewalk]
matches = ['\b(?:đi|chạy|leo|lái)(?: [^\n]{0,20})? (?:lên|trên) (?:vỉa hè|hè phố)\b']
exclude = ['\b(vào nhà|cơ quan|đỗ xe|để xe|họp chợ|bày bán)\b']
condition = "điều khiển xe đi trên vỉa hè (trừ trường hợp điều khiển xe đi qua vỉa hè để vào nhà, cơ quan)"

[topics.expressway_entry]
matches = ['\b(?:đi|chạy|lái)(?: [^\n]{0,20})? (?:vào|lên) (?:đường )?cao tốc\b']
exclude = ['\b(phục vụ|quản lý|bảo trì|dừng xe|đỗ xe|lùi xe|quay đầu|ngược chiều|làn dừng|chuyển làn|tốc độ|khoảng cách)\b']
condition = "điều khiển xe mô tô, xe gắn máy đi vào đường cao tốc (trừ xe phục vụ việc quản lý, bảo trì đường cao tốc)"

[topics.alcohol]
matches = ['\bnồng độ cồn\b', '\buống rượu bia[^\n]{0,20}(?:lái xe|điều khiển xe|chạy xe|tham gia giao thông)\b', '\b(?:lái xe|điều khiển xe)[^\n]{0,25}(?:rượu bia|có cồn|say rượu)\b']
exclude = ['\b(không chấp hành|từ chối kiểm tra|ma túy|chất kích thích)\b']
condition = "điều khiển xe trên đường mà trong máu hoặc hơi thở có nồng độ cồn"

