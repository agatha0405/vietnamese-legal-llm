fact = """Người điều khiển xe đạp, xe đạp máy hoặc xe thô sơ khác trên đường mà trong máu hoặc hơi thở có nồng độ cồn bị xử phạt theo 03 mức (không áp dụng trừ điểm giấy phép lái xe):
