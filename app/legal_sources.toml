fact = "Giấy phép lái xe hạng A1 cấp theo quy định này dùng cho mô tô hai bánh có dung tích xi-lanh đến 125 cm³ hoặc công suất động cơ điện đến 11 kW."

[[provisions]]
id = "license-points-d58"
matches = ['\bgiấy phép lái xe\b|\bbằng lái\b', '\b(?:có bao nhiêu điểm|bao nhiêu điểm|12 điểm|phục hồi điểm|trừ hết điểm)\b']
exclude = ['\b(?:vi phạm|vượt đèn đỏ|ngược chiều|điện thoại|mũ bảo hiểm|nồng độ cồn|vỉa hè)\b']
document = "traffic_law"
effective_from = 2025-01-01
citation = "khoản 1, 2 và 3 Điều 58"
fact = "Giấy phép lái xe bao gồm 12 điểm. Giấy phép lái xe chưa bị trừ hết điểm và không bị trừ điểm trong thời hạn 12 tháng từ ngày bị trừ điểm gần nhất thì được phục hồi đủ 12 điểm. Trường hợp bị trừ hết điểm thì không được điều khiển phương tiện theo giấy phép đó và sau ít nhất 06 tháng phải kiểm tra kiến thức pháp luật đạt yêu cầu mới được phục hồi đủ 12 điểm."

[[definitions]]
id = "def-55-2-4-duong-uu-tien"
document = "traffic_law"
citation = "khoản 4 Điều 2 Luật 36/2024/QH15"
title = "Đường ưu tiên là gì"
text = "Theo khoản 4 Điều 2 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, đường ưu tiên là đường mà trên đó phương tiện tham gia giao thông đường bộ được các phương tiện tham gia giao thông đường bộ đến từ hướng khác nhường đường khi qua nơi đường giao nhau, được cắm biển báo hiệu đường ưu tiên."

[[definitions]]
id = "def-55-2-5-phan-duong-xe-chay"
document = "traffic_law"
citation = "khoản 5 Điều 2 Luật 36/2024/QH15"
title = "Phần đường xe chạy là gì"
text = "Theo khoản 5 Điều 2 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, phần đường xe chạy là phần của đường bộ được sử dụng cho phương tiện giao thông đường bộ đi lại."

[[definitions]]
id = "def-55-2-6-lan-duong"
document = "traffic_law"
citation = "khoản 6 Điều 2 Luật 36/2024/QH15"
title = "Làn đường là gì"
text = "Theo khoản 6 Điều 2 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, làn đường là một phần của phần đường xe chạy được chia theo chiều dọc của đường, có đủ chiều rộng cho xe chạy an toàn."

[[definitions]]
id = "def-55-2-8-nguoi-tham-gia"
document = "traffic_law"
citation = "khoản 8 Điều 2 Luật 36/2024/QH15"
title = "Người tham gia giao thông đường bộ là gì"
text = "Theo khoản 8 Điều 2 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, người tham gia giao thông đường bộ bao gồm: người điều khiển, người được chở trên phương tiện tham gia giao thông đường bộ; người điều khiển, dẫn dắt vật nuôi trên đường bộ; người đi bộ trên đường bộ."

[[definitions]]
id = "def-55-2-11-un-tac"
document = "traffic_law"
citation = "khoản 11 Điều 2 Luật 36/2024/QH15"
title = "Ùn tắc giao thông đường bộ là gì"
text = "Theo khoản 11 Điều 2 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, ùn tắc giao thông đường bộ là tình trạng người, phương tiện tham gia giao thông đường bộ bị dồn ứ, di chuyển với tốc độ rất chậm hoặc không thể di chuyển được."

[[definitions]]
id = "def-55-2-12-tai-nan"
document = "traffic_law"
citation = "khoản 12 Điều 2 Luật 36/2024/QH15"
title = "Tai nạn giao thông đường bộ là gì"
text = "Theo khoản 12 Điều 2 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, tai nạn giao thông đường bộ là va chạm liên quan đến người, phương tiện khi tham gia giao thông đường bộ, xảy ra ngoài ý muốn của người tham gia giao thông đường bộ, gây thiệt hại đến tính mạng, sức khỏe, tài sản của cá nhân hoặc tài sản của cơ quan, tổ chức."

[[definitions]]
id = "def-55-34-1-xe-mo-to"
document = "traffic_law"
citation = "điểm e khoản 1 Điều 34 Luật 36/2024/QH15"
title = "Xe mô tô là gì"
text = "Theo điểm e khoản 1 Điều 34 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, xe mô tô thuộc nhóm xe cơ giới, gồm xe có hai hoặc ba bánh chạy bằng động cơ, được thiết kế, sản xuất để hoạt động trên đường bộ, trừ xe gắn máy; đối với xe ba bánh thì khối lượng bản thân không lớn hơn 400 kg."

[[definitions]]
id = "def-55-34-1-xe-gan-may"
document = "traffic_law"
citation = "điểm g khoản 1 Điều 34 Luật 36/2024/QH15"
title = "Xe gắn máy là gì"
text = "Theo điểm g khoản 1 Điều 34 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, xe gắn máy thuộc nhóm xe cơ giới, là xe có hai hoặc ba bánh chạy bằng động cơ, có vận tốc thiết kế không lớn hơn 50 km/h; nếu động cơ nhiệt thì dung tích làm việc không lớn hơn 50 cm3; nếu động cơ điện thì công suất không lớn hơn 04 kW; không bao gồm xe đạp máy."

[[definitions]]
id = "def-55-34-2-xe-tho-so"
document = "traffic_law"
citation = "khoản 2 Điều 34 Luật 36/2024/QH15"
title = "Xe thô sơ và xe đạp máy là gì"
text = "Theo khoản 2 Điều 34 Luật Trật tự, an toàn giao thông đường bộ 36/2024/QH15, xe thô sơ bao gồm: xe đạp; xe đạp máy (gồm cả xe đạp điện có trợ lực động cơ bị ngắt khi dừng đạp hoặc đạt 25 km/h); xe xích lô; xe lăn dùng cho người khuyết tật; xe vật nuôi kéo."

[[definitions]]
id = "def-55-14-vuot-xe"
document = "traffic_law"
citation = "khoản 1, 2, 3, 4 và 6 Điều 14 Luật 36/2024/QH15"
title = "Quy định về vượt xe và nhường đường cho xe xin vượt"
text = "Theo Điều 14 Luật 36/2024/QH15, khi vượt các xe phải vượt bên trái (chỉ vượt bên phải khi xe phía trước có tín hiệu rẽ trái hoặc đang rẽ trái hoặc xe chuyên dùng đang làm việc mà không thể vượt bên trái). Xe xin vượt chỉ được vượt khi không có chướng ngại vật phía trước, không có xe ngược chiều, xe trước không có tín hiệu vượt xe khác, đã có tín hiệu rẽ phải và tránh về bên phải. Khi đủ điều kiện an toàn, xe phía trước phải giảm tốc độ, bật tín hiệu rẽ phải và đi sát về bên phải."

[[definitions]]
id = "def-55-16-lui-xe"
document = "traffic_law"
citation = "Điều 16 Luật 36/2024/QH15"
title = "Quy định về lùi xe và các nơi cấm lùi xe"
text = "Theo Điều 16 Luật 36/2024/QH15, khi lùi xe phải quan sát hai bên và phía sau, có tín hiệu lùi và chỉ lùi khi bảo đảm an toàn. Không được lùi xe ở đường một chiều, khu vực cấm dừng, trên phần đường dành cho người đi bộ qua đường, nơi đường bộ giao nhau, đường bộ giao nhau cùng mức với đường sắt, nơi tầm nhìn bị che khuất, trong hầm đường bộ, trên đường cao tốc."
